<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 100" width="800" height="100" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Thanks for visiting</title>
  <style>
    text{font-family:"Courier New",Courier,monospace;font-weight:900}
    .blink{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
    .hop{animation:hop .8s steps(1) infinite}
    @keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin .5s steps(1) infinite}
    @keyframes spin{0%{transform:scaleX(1)}25%{transform:scaleX(.5)}50%{transform:scaleX(.15)}75%{transform:scaleX(.5)}}
  </style>
  <defs>
    <pattern id="gb" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#d9632b"/>
      <rect y="0" width="40" height="2" fill="#000"/><rect y="10" width="40" height="2" fill="#000"/>
      <rect x="0" width="2" height="10" fill="#000"/><rect x="20" y="10" width="2" height="10" fill="#000"/>
    </pattern>
    <g id="coin"><g class="spin"><rect width="12" height="20" fill="#fbd000" stroke="#000" stroke-width="2"/><rect x="5" y="4" width="2" height="12" fill="#c98f00"/></g></g>
  </defs>
  <rect width="800" height="100" fill="#5c94fc"/>
  <rect y="76" width="800" height="24" fill="url(#gb)"/>
  <rect y="74" width="800" height="2" fill="#000"/>
  <g class="hop"><use xlink:href="#coin" href="#coin" x="160" y="40"/></g>
  <g class="hop" style="animation-delay:.4s"><use xlink:href="#coin" href="#coin" x="628" y="40"/></g>
  <text class="blink" x="400" y="42" font-size="24" letter-spacing="3" text-anchor="middle" fill="#fff" stroke="#000" stroke-width="6" paint-order="stroke">THANKS FOR VISITING!</text>
  <text x="400" y="64" font-size="12" letter-spacing="2" text-anchor="middle" fill="#fbd000" stroke="#000" stroke-width="4" paint-order="stroke">SEE YOU IN WORLD 1-2  *  (C) 2026 YOUR NAME</text>
</svg>
