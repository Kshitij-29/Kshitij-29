.g1{animation:g1 5s steps(1) infinite}@keyframes g1{0%,90%{transform:translate(0,0)}91%{transform:translate(-4px,1px)}93%{transform:translate(3px,-1px)}95%,100%{transform:translate(0,0)}}
.g2{animation:g2 5s steps(1) infinite}@keyframes g2{0%,90%{transform:translate(0,0)}91%{transform:translate(4px,-1px)}93%{transform:translate(-3px,1px)}95%,100%{transform:translate(0,0)}}
