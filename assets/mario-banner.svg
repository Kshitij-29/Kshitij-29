<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 300" width="800" height="300" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>8-bit platformer banner</title>
  <style>
    text{font-family:"Courier New",Courier,monospace;font-weight:900}
    .hud{font-size:14px;fill:#fff;stroke:#000;stroke-width:4px;paint-order:stroke}
    .clouds{animation:sc 20s linear infinite}
    .hills{animation:sc 8s linear infinite}
    .near{animation:sc 4s linear infinite}
    @keyframes sc{to{transform:translateX(-400px)}}
    .gnd{animation:g .4s linear infinite}
    @keyframes g{to{transform:translateX(-40px)}}
    .la{animation:la .36s step-end infinite}
    @keyframes la{0%{opacity:1}50%{opacity:0}}
    .lb{animation:lb .36s step-end infinite}
    @keyframes lb{0%{opacity:0}50%{opacity:1}}
    .bob{animation:bob .36s step-end infinite}
    @keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .jump{animation:jump 3s linear infinite}
    @keyframes jump{0%,30%{transform:translateY(0);animation-timing-function:ease-out}40%{transform:translateY(-44px);animation-timing-function:ease-in}50%,100%{transform:translateY(0)}}
    .bump{animation:bump 3s linear infinite}
    @keyframes bump{0%,38%{transform:translateY(0)}42%{transform:translateY(-8px)}48%,100%{transform:translateY(0)}}
    .pop{animation:pop 3s linear infinite;opacity:0}
    @keyframes pop{0%,39%{opacity:0;transform:translateY(0)}40%{opacity:1;transform:translateY(0)}58%{opacity:1;transform:translateY(-50px)}62%,100%{opacity:0;transform:translateY(-50px)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin .5s steps(1) infinite}
    @keyframes spin{0%{transform:scaleX(1)}25%{transform:scaleX(.5)}50%{transform:scaleX(.15)}75%{transform:scaleX(.5)}}
    .blink{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
    .title{font-size:46px;letter-spacing:4px;text-anchor:middle;stroke:#000;stroke-width:8px;paint-order:stroke}
  </style>
  <defs>
    <pattern id="gbrick" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#d9632b"/>
      <rect y="0" width="40" height="2" fill="#000"/>
      <rect y="10" width="40" height="2" fill="#000"/>
      <rect x="0" y="0" width="2" height="10" fill="#000"/>
      <rect x="20" y="10" width="2" height="10" fill="#000"/>
      <rect x="4" y="4" width="6" height="2" fill="#f0905a"/>
      <rect x="26" y="14" width="6" height="2" fill="#f0905a"/>
    </pattern>
    <g id="cloud">
      <rect x="16" y="0" width="24" height="8" fill="#fff"/>
      <rect x="8" y="8" width="40" height="8" fill="#fff"/>
      <rect x="0" y="16" width="64" height="8" fill="#fff"/>
      <rect x="0" y="24" width="64" height="4" fill="#bcd8ff"/>
    </g>
    <g id="hills">
      <rect x="60" y="200" width="100" height="40" fill="#2fb04a"/>
      <rect x="76" y="184" width="68" height="16" fill="#2fb04a"/>
      <rect x="92" y="168" width="36" height="16" fill="#2fb04a"/>
      <rect x="100" y="188" width="8" height="12" fill="#1f8a38"/>
      <rect x="120" y="204" width="8" height="12" fill="#1f8a38"/>
      <rect x="250" y="216" width="90" height="24" fill="#2fb04a"/>
      <rect x="262" y="202" width="66" height="14" fill="#2fb04a"/>
      <rect x="278" y="190" width="34" height="12" fill="#2fb04a"/>
      <rect x="290" y="206" width="8" height="10" fill="#1f8a38"/>
    </g>
    <g id="near">
      <rect x="140" y="224" width="44" height="16" fill="#2fb04a"/>
      <rect x="148" y="216" width="28" height="8" fill="#2fb04a"/>
      <rect x="160" y="228" width="6" height="6" fill="#1f8a38"/>
      <rect x="296" y="176" width="52" height="16" fill="#00a800" stroke="#000" stroke-width="3"/>
      <rect x="300" y="192" width="44" height="48" fill="#00a800" stroke="#000" stroke-width="3"/>
      <rect x="304" y="180" width="8" height="10" fill="#7cf27c"/>
      <rect x="306" y="196" width="6" height="40" fill="#7cf27c"/>
    </g>
    <g id="brickblock">
      <rect width="32" height="32" fill="#d9632b" stroke="#000" stroke-width="2"/>
      <rect x="0" y="15" width="32" height="2" fill="#000"/>
      <rect x="15" y="0" width="2" height="15" fill="#000"/>
      <rect x="7" y="17" width="2" height="15" fill="#000"/>
      <rect x="23" y="17" width="2" height="15" fill="#000"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="800" height="300" fill="#5c94fc"/>
  <g class="clouds">
    <use xlink:href="#cloud" href="#cloud" x="40" y="70"/><use xlink:href="#cloud" href="#cloud" x="240" y="110"/>
    <use xlink:href="#cloud" href="#cloud" x="440" y="70"/><use xlink:href="#cloud" href="#cloud" x="640" y="110"/>
    <use xlink:href="#cloud" href="#cloud" x="840" y="70"/><use xlink:href="#cloud" href="#cloud" x="1040" y="110"/>
  </g>
  <g class="hills"><use xlink:href="#hills" href="#hills"/><use xlink:href="#hills" href="#hills" x="400"/><use xlink:href="#hills" href="#hills" x="800"/></g>
  <g class="near"><use xlink:href="#near" href="#near"/><use xlink:href="#near" href="#near" x="400"/><use xlink:href="#near" href="#near" x="800"/></g>

  <!-- ground -->
  <g class="gnd"><rect x="0" y="240" width="840" height="60" fill="url(#gbrick)"/></g>
  <rect x="0" y="238" width="800" height="2" fill="#000"/>

  <!-- HUD -->
  <text class="hud" x="40" y="26">PLAYER</text><text class="hud" x="40" y="46">000000</text>
  <text class="hud" x="250" y="26">COINS</text><text class="hud" x="250" y="46">x 00</text>
  <rect x="226" y="32" width="12" height="16" fill="#fbd000" stroke="#000" stroke-width="2"/>
  <text class="hud" x="450" y="26">WORLD</text><text class="hud" x="450" y="46">1-1</text>
  <text class="hud" x="640" y="26">TIME</text><text class="hud" x="640" y="46">400</text>

  <!-- title -->
  <text class="title" x="450" y="112" fill="#fbd000">YOUR NAME</text>
  <text x="450" y="146" font-size="18" letter-spacing="3" text-anchor="middle" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke">SOFTWARE ENGINEER</text>
  <text class="blink" x="450" y="184" font-size="16" letter-spacing="3" text-anchor="middle" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke">PRESS START</text>

  <!-- blocks -->
  <use xlink:href="#brickblock" href="#brickblock" x="72" y="114"/>
  <use xlink:href="#brickblock" href="#brickblock" x="136" y="114"/>
  <g class="bump">
    <rect x="104" y="114" width="32" height="32" fill="#fbd000" stroke="#000" stroke-width="2"/>
    <rect x="107" y="117" width="3" height="3" fill="#a66a00"/><rect x="130" y="117" width="3" height="3" fill="#a66a00"/>
    <rect x="107" y="140" width="3" height="3" fill="#a66a00"/><rect x="130" y="140" width="3" height="3" fill="#a66a00"/>
    <g transform="translate(112,120) scale(3)" fill="#7a3e00">
      <rect x="1" y="0" width="3" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/>
      <rect x="4" y="2" width="1" height="1"/><rect x="2" y="3" width="2" height="1"/><rect x="2" y="4" width="1" height="1"/>
      <rect x="2" y="6" width="1" height="1"/>
    </g>
  </g>
  <!-- coin pop -->
  <g class="pop"><g class="spin"><rect x="114" y="90" width="12" height="20" fill="#fbd000" stroke="#000" stroke-width="2"/><rect x="119" y="94" width="2" height="12" fill="#c98f00"/></g></g>

  <!-- original hero -->
  <g transform="translate(104,192)"><g class="jump"><g class="bob"><g transform="scale(4)">
    <rect x="2" y="0" width="4" height="1" fill="#e52521"/>
    <rect x="2" y="1" width="6" height="1" fill="#e52521"/>
    <rect x="1" y="2" width="1" height="2" fill="#6b3a12"/>
    <rect x="2" y="2" width="4" height="2" fill="#f2a65a"/>
    <rect x="5" y="2" width="1" height="1" fill="#111"/>
    <rect x="1" y="4" width="1" height="3" fill="#e52521"/>
    <rect x="6" y="4" width="1" height="3" fill="#e52521"/>
    <rect x="2" y="4" width="4" height="4" fill="#049cd8"/>
    <rect x="3" y="5" width="1" height="1" fill="#fbd000"/>
    <rect x="1" y="7" width="1" height="1" fill="#f2a65a"/>
    <rect x="6" y="7" width="1" height="1" fill="#f2a65a"/>
    <g class="la">
      <rect x="1" y="8" width="2" height="2" fill="#049cd8"/><rect x="0" y="10" width="3" height="2" fill="#6b3a12"/>
      <rect x="5" y="8" width="2" height="2" fill="#049cd8"/><rect x="5" y="10" width="3" height="2" fill="#6b3a12"/>
    </g>
    <g class="lb">
      <rect x="3" y="8" width="2" height="2" fill="#049cd8"/><rect x="2" y="10" width="4" height="2" fill="#6b3a12"/>
    </g>
  </g></g></g></g>
</svg>
